services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: api_management_tax
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_postgres_only
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d api_management_tax"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    profiles: ["idp"]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-management-tax.json:/opt/keycloak/data/import/realm-management-tax.json:ro

volumes:
  postgres_data:
