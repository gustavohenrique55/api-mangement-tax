services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: api_management_tax
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_postgres_only
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d api_management_tax"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
