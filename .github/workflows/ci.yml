name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Gate (lint, tests, build, audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: OpenAPI lint
        run: pnpm openapi:lint

      - name: ESLint
        run: pnpm lint

      - name: Unit and e2e tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Dependency audit (high and critical)
        run: pnpm audit --audit-level high --prod

  rls-integration:
    name: RLS integration (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: api_management_tax
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local_postgres_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d api_management_tax"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      MIGRATION_DATABASE_URL: postgresql://postgres:local_postgres_only@localhost:5432/api_management_tax?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Apply migrations
        run: pnpm prisma:migrate:deploy

      - name: Row-level security integration test
        run: pnpm test:rls

  oidc-integration:
    name: OIDC integration (Keycloak)
    runs-on: ubuntu-latest
    env:
      KEYCLOAK_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      # The realm JSON is bind-mounted from the checkout, so Keycloak has to
      # start as a step (a `services:` container would boot before checkout).
      - name: Start Keycloak with the dev realm
        run: docker compose --profile idp up -d keycloak

      # `--wait` is not enough: the compose service declares no healthcheck and
      # the realm import finishes well after the container reports "running".
      - name: Wait for the realm import to finish
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS "$KEYCLOAK_URL/realms/management-tax/.well-known/openid-configuration" >/dev/null; then
              echo "Realm management-tax ready after $attempt attempt(s)."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Keycloak realm did not become ready within 120s."
          exit 1

      - name: OIDC integration test
        run: pnpm test:oidc

      - name: Keycloak logs
        if: failure()
        run: docker compose --profile idp logs --no-color keycloak

      # No `--volumes`: it would also drop the postgres_data volume declared in
      # the same compose file.
      - name: Tear down Keycloak
        if: always()
        run: docker compose --profile idp down
