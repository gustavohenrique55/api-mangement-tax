name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Gate (lint, tests, build, audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: OpenAPI lint
        run: pnpm openapi:lint

      - name: ESLint
        run: pnpm lint

      - name: Unit and e2e tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Dependency audit (high and critical)
        run: pnpm audit --audit-level high --prod

  rls-integration:
    name: RLS integration (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: api_management_tax
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local_postgres_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d api_management_tax"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      MIGRATION_DATABASE_URL: postgresql://postgres:local_postgres_only@localhost:5432/api_management_tax?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Apply migrations
        run: pnpm prisma:migrate:deploy

      - name: Row-level security integration test
        run: pnpm test:rls
